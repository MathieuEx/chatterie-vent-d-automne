# Déploiement du front-end sur Netlify.
#
# Le dépôt contient deux projets Node indépendants (web/ et studio/) ; seul
# `web` est déployé ici. `base` place Netlify dans ce dossier, et les chemins
# ci-dessous sont donc relatifs à web/.
#
# Le Studio Sanity n'est pas concerné : il est hébergé par Sanity
# (chatterie-vents-dautomne.sanity.studio) et se déploie avec `npm run deploy`
# depuis studio/.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

# Adaptateur officiel Next.js (OpenNext). Netlify l'installe automatiquement
# quand il détecte Next.js, mais le déclarer rend le déploiement reproductible
# plutôt que dépendant de la détection.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Aligne l'environnement de build sur la version utilisée en local.
  NODE_VERSION = "22"

  # Netlify fait échouer le build s'il retrouve la valeur d'une variable
  # d'environnement dans les fichiers produits. Or le préfixe `NEXT_PUBLIC_`
  # signifie précisément « à intégrer au JavaScript envoyé au navigateur » :
  # ces valeurs sont publiques par construction (l'identifiant de projet Sanity
  # figure déjà dans l'URL de chaque image du site). Sans cette liste, le
  # déploiement échouerait sur une fausse alerte de secret exposé.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,NEXT_PUBLIC_SANITY_API_VERSION,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_CONTACT_PROVIDER"

# Le Studio Sanity appelle le site depuis un autre domaine ; sans cet en-tête,
# le navigateur bloquerait la requête de rafraîchissement du contenu.
[[headers]]
  for = "/api/revalidate"
  [headers.values]
    Access-Control-Allow-Origin = "https://chatterie-vents-dautomne.sanity.studio"
