<!doctype html>
<!--
  Déclaration du formulaire de contact pour Netlify.

  Netlify repère les formulaires en analysant le HTML *statique* au moment du
  déploiement. Le vrai formulaire du site étant rendu par React, il lui est
  invisible : ce fichier existe uniquement pour déclarer le nom du formulaire et
  ses champs. Seuls les champs listés ici sont enregistrés — en ajouter un au
  formulaire React sans le déclarer ici le ferait silencieusement ignorer.

  Le fichier n'est jamais montré à un visiteur ; ContactForm.tsx y envoie les
  réponses en POST.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Formulaire de contact</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <!-- Langue de la page d'où vient le message, pour savoir dans quelle
           langue répondre. -->
      <input type="text" name="locale" />
      <!-- Piège à robots : un humain ne le voit pas et le laisse vide. -->
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
